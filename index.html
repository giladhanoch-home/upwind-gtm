<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Upwind MOps Home Assignment · Gilad Hanoch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,300&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: Upwind-style light marketing page. Sticky top nav, centered 1120px column, one section per slide, progress-dot rail fixed at the right middle. Light-only by choice, to match upwind.io. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --soft:#F8FAFC; --wash:#F2F7FC;
  --ink:#18202D; --text-2:#455972; --muted:#75808E; --line:#D8DFE9; --line-2:#E8EDF3;
  --coral:#F2583C; --violet:#9214C4; --blue:#1E71ED;
  --blue-ic:#5697EA; --blue-bg:#F2F7FF; --blue-bd:#C9DCFA;
  --vio-ic:#A191FD; --vio-bg:#F7F5FF; --vio-bd:#DCD3FB;
  --cor-ic:#F47D93; --cor-bg:#FFF3F5; --cor-bd:#F9CDD5;
  --grad:linear-gradient(90deg,#F2583C 0%,#9214C4 54%,#1E71ED 100%);
  --grad-soft:linear-gradient(90deg,#5697EA 0%,#9214C4 50%,#F47D93 100%);
  --f-sans:"Hanken Grotesk","aktiv-grotesk","Helvetica Neue",Arial,sans-serif;
  --f-accent:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  --nav-h:68px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 12px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.6;letter-spacing:-.15px;-webkit-font-smoothing:antialiased}
a{color:inherit}
p{margin:0}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance}
em.acc{font-family:var(--f-accent);font-style:italic;font-weight:300;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono)}

/* ---------- top line + nav ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.topline{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:2px;background:var(--grad);z-index:61}
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
header.nav.scrolled{border-bottom-color:var(--line-2)}
.nav-in{height:var(--nav-h);display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);flex:none}
.brand svg{height:24px;width:auto}
.brand .tagline{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-left:12px;border-left:1px solid var(--line)}
.menu{display:flex;align-items:center;gap:2px;flex:1;justify-content:center;list-style:none;margin:0;padding:0}
.menu > li{position:relative}
.menu .top{font:400 15px var(--f-sans);color:var(--ink);background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.menu .top:hover,.menu li.open > .top{background:var(--soft)}
.menu .top.current{color:var(--violet)}
.menu .top .chev{width:9px;height:12px;opacity:.7}
.menu .top.soon{color:var(--muted)}
.dd{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);min-width:300px;background:var(--bg);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 12px 32px rgba(24,32,45,.10);padding:8px;display:none}
.menu li.open .dd{display:block}
.dd a,.dd span.item{display:grid;grid-template-columns:34px 1fr;gap:2px 10px;padding:9px 10px;border-radius:8px;text-decoration:none;font-size:14px;line-height:1.35}
.dd a:hover{background:var(--soft)}
.dd .qid{font:500 12px var(--f-mono);color:var(--violet);grid-row:span 2;padding-top:1px}
.dd .qt{color:var(--ink)}
.dd .qs{color:var(--muted);font-size:12.5px}
.dd span.item .qid{color:var(--muted)}
.dd .soon-note{font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}
.nav-cta{display:flex;align-items:center;gap:18px;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;font:500 15px var(--f-sans);letter-spacing:-.16px;color:var(--ink);background:var(--bg);border:1px solid var(--ink);border-radius:999px;padding:9px 18px;text-decoration:none;cursor:pointer;transition:background .15s,color .15s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.solid:hover{background:var(--bg);color:var(--ink)}
.btn.sm{font-size:14px;padding:7px 14px}
.link-assume{font-size:13px;color:var(--muted);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.link-assume:hover{color:var(--ink)}
.link-assume svg{width:13px;height:13px;color:var(--coral)}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font:500 14px var(--f-sans);color:var(--ink)}

/* ---------- progress rail ---------- */
.rail{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;align-items:stretch;gap:4px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line-2);border-radius:16px;padding:12px 12px 10px;box-shadow:0 10px 30px rgba(24,32,45,.08);min-width:150px}
.rail .grp{display:flex;flex-direction:column;gap:2px;padding:2px 0}
.rail .grp + .grp{border-top:1px solid var(--line-2);padding-top:8px;margin-top:4px}
.rail .glabel{font:600 10.5px var(--f-sans);color:var(--violet);letter-spacing:.1em;text-transform:uppercase;padding:0 4px 2px}
.rail .ri{display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:transparent;padding:5px 4px;border-radius:8px;cursor:pointer;font:500 13px var(--f-sans);color:var(--muted);text-align:left;transition:background .15s,color .15s}
.rail .ri:hover{background:var(--soft);color:var(--ink)}
.rail .ri .d{width:10px;height:10px;border-radius:999px;background:var(--line);flex:none;transition:height .25s,background .25s}
.rail .ri.done{color:var(--text-2)}
.rail .ri.done .d{background:#9AA7B8}
.rail .ri.on{color:var(--ink);font-weight:600}
.rail .ri.on .d{height:22px;background:linear-gradient(180deg,#F2583C,#9214C4 54%,#1E71ED)}
.rail .rfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line-2);margin-top:6px;padding-top:10px}
.rail .meter{font:500 11.5px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.rail .rnext{font:600 13px var(--f-sans);color:#fff;background:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.rail .rnext:hover{background:#fff;color:var(--ink)}

/* ---------- hero ---------- */
.hero{padding-block:28px 0}
.hero-card{position:relative;border-radius:16px;overflow:hidden;min-height:520px;display:grid;place-items:center;text-align:center;background:#101B3A;color:#fff;isolation:isolate}
.hero-card canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero-card .veil{position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 55% at 50% 52%,rgba(10,16,40,.55),rgba(10,16,40,0) 70%)}
.hero-in{max-width:820px;padding:56px 28px;display:flex;flex-direction:column;align-items:center;gap:20px}
.pill-news{font:700 14px var(--f-sans);color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:6px;padding:6px 12px;background:rgba(255,255,255,.06)}
.hero h1{font-size:clamp(38px,5.4vw,60px);line-height:1.12;letter-spacing:-.02em;font-weight:400}
.hero h1 em.acc{font-size:1.04em}
.hero p.sub{font-size:17px;line-height:1.6;color:rgba(255,255,255,.88);max-width:56ch}
.hero .ctas{margin-top:8px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.brain-link{margin-top:20px;display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;font-size:14px;color:rgba(255,255,255,.85);text-decoration:none;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);backdrop-filter:blur(6px);transition:border-color .2s,background .2s,color .2s}
.brain-link b{font-weight:600;color:#fff}
.brain-link .ar{transition:transform .2s}
.brain-link:hover{color:#fff;border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.12)}
.brain-link:hover .ar{transform:translateX(3px)}
@media (max-width:600px){.brain-link{font-size:12.5px;padding:8px 12px;text-align:left}}
.btn.light{background:#fff;color:var(--ink);border-color:#fff;border-radius:6px}
.btn.light:hover{background:transparent;color:#fff}
.btn.ghost-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.7);border-radius:6px}
.btn.ghost-light:hover{background:#fff;color:var(--ink)}
.byline{font:13px var(--f-mono);color:rgba(255,255,255,.7)}

.stack{padding-block:44px 8px;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
.stack .lbl{font-size:16px;color:var(--ink)}
.stack-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;align-items:center}
.stack-row span{font:500 15px var(--f-sans);color:var(--text-2);display:inline-flex;align-items:center;gap:8px}
.stack-row i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* ---------- sections ---------- */
section.sec{padding-block:96px 24px}
.sec-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin-bottom:40px}
.kicker{font:500 13px var(--f-sans);color:var(--violet);border:1px solid var(--vio-bd);background:var(--vio-bg);border-radius:6px;padding:4px 12px}
.kicker-cta{text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,border-color .15s}
.kicker-cta:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.kicker-cta span{transition:transform .2s}
.kicker-cta:hover span{transform:translateY(2px)}
.kicker.blue{color:var(--blue);border-color:var(--blue-bd);background:var(--blue-bg)}
.kicker.coral{color:#D9402A;border-color:var(--cor-bd);background:var(--cor-bg)}
.sec-head h2{font-size:clamp(30px,3.6vw,40px);line-height:1.18;letter-spacing:-.015em;max-width:24ch}
.sec-head p{color:var(--text-2);max-width:66ch;font-size:16px}
.sec-head.tight{margin-bottom:18px}
.sec-head.tight h2{max-width:none}
.sec-head.tight p{max-width:92ch}
.part-intro{padding-block:40px 0}
.part-intro .wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.part-letter{font:500 13px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.part-intro h2{font-size:clamp(34px,4.4vw,52px);line-height:1.1;letter-spacing:-.02em}
.part-intro .gbar{width:120px;height:3px;border-radius:3px;background:var(--grad)}
.part-intro p{color:var(--text-2);max-width:92ch}

.frame{border:1px solid var(--line-2);border-radius:14px;background:var(--bg);padding:28px}
.dots{background-image:radial-gradient(circle,#D7DEE8 1px,transparent 1.2px);background-size:14px 14px}
.label{font:500 11.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lead-p{color:var(--text-2);font-size:15px}
.deeper{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:34px;align-items:center}
.deeper .label{margin-right:4px}
.chip{display:inline-flex;align-items:center;font:500 12.5px var(--f-mono);padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);white-space:nowrap}
.chip.b{border-color:var(--blue-bd);background:var(--blue-bg);color:var(--blue)}
.chip.v{border-color:var(--vio-bd);background:var(--vio-bg);color:var(--violet)}
.chip.c{border-color:var(--cor-bd);background:var(--cor-bg);color:#D9402A}
.chip.g{border-color:#CBE9D9;background:#F1FAF5;color:#1F8A5B}

/* three lenses (Upwind pattern) */
.lenses{position:relative;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-2);border-radius:14px;overflow:hidden}
.lens{padding:22px 20px 24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lens + .lens{border-left:1px solid var(--line-2)}
.lens-h{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;border-radius:6px;padding:7px 10px;border:1px solid}
.lens.b .lens-h{background:var(--blue-bg);border-color:var(--blue-bd)}
.lens.v .lens-h{background:var(--vio-bg);border-color:var(--vio-bd)}
.lens.c .lens-h{background:var(--cor-bg);border-color:var(--cor-bd)}
.lens-h svg{width:15px;height:15px}
.lens.b .lens-h svg{color:var(--blue-ic)} .lens.v .lens-h svg{color:var(--violet)} .lens.c .lens-h svg{color:var(--cor-ic)}
.lens .item{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.45;border:1px solid var(--line-2);border-radius:6px;padding:7px 10px;background:var(--bg)}
.lens.b .item{background:linear-gradient(var(--blue-bg),var(--blue-bg)) padding-box;border-color:#E0EBFB}
.lens.v .item{background:var(--soft)}
.lens.c .item{background:var(--cor-bg);border-color:#FBE0E5}
.lens .item b{font-weight:600}
.lens .then{font-size:14px;color:var(--ink);margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
.lens .then strong{font-weight:600}
.gradbar{grid-column:1 / -1;margin:0 auto;height:30px;border-radius:4px;background:linear-gradient(90deg,#8C7CF7 0%,#B13BD1 50%,#E05A9A 100%);color:#fff;font:500 14px var(--f-sans);display:flex;align-items:center;justify-content:center;padding:0 18px}

/* A1: two-lane ladder */
.ladder-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.ladder{min-width:880px;display:grid;grid-template-columns:150px repeat(7,1fr);gap:10px 8px;align-items:stretch}
.ladder .rowlbl{display:flex;flex-direction:column;justify-content:center;gap:2px;font-size:12px;padding-right:8px;color:var(--text-2);line-height:1.3}
.ladder .rowlbl b{font-weight:600;color:var(--ink);font-size:14px}
.bracket{font:500 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line);text-align:center}
.bracket.sales{border-bottom:2px solid transparent;border-image:var(--grad) 1;color:var(--ink)}
.stg{font:500 15px var(--f-sans);border:1px solid var(--blue-bd);background:var(--blue-bg);color:var(--ink);border-radius:8px;padding:10px 8px;text-align:center;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.stg:hover{border-color:var(--blue-ic)}
.stg[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);background:var(--bg)}
.stg small{display:block;font:400 11px var(--f-mono);color:var(--muted);margin-top:2px}
.sts{display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:8px;padding:8px 4px;cursor:pointer}
.sts .chip{font-size:11.5px}
.sts.sel{border-style:solid;border-color:var(--ink)}
.wfbar{grid-column:2 / -1;height:28px;border-radius:4px;background:linear-gradient(90deg,#8C7CF7 0%,#B13BD1 50%,#E05A9A 100%);color:#fff;font:500 13px var(--f-sans);display:flex;align-items:center;justify-content:center;gap:8px}
.stage-detail{margin-top:22px;display:grid;grid-template-columns:1.1fr 1fr 1.4fr;gap:0;border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.stage-detail > div{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stage-detail > div + div{border-left:1px solid var(--line-2)}
.stage-detail .big{font-size:24px;line-height:1.2}
.stage-detail .v{font-size:15px}
.rules4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.rule{border:1px solid var(--line-2);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.rule h4{font-size:15px;font-weight:600;line-height:1.3}
.rule p{font-size:14px;color:var(--text-2);line-height:1.5}

.subhead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin:64px 0 26px}
.subhead h3{font-size:clamp(22px,2.4vw,26px);line-height:1.25;letter-spacing:-.01em;max-width:34ch}
.subhead p{color:var(--text-2);max-width:62ch;font-size:15px}

/* A2 */
.reasons{border:1px solid var(--line-2);border-radius:14px;overflow:hidden}
.reason{display:grid;grid-template-columns:240px 1fr auto;gap:20px;align-items:center;padding:16px 22px}
.reason + .reason{border-top:1px solid var(--line-2)}
.reason h4{font-size:16px;font-weight:500}
.reason p{font-size:14px;color:var(--text-2);line-height:1.5}
.sla{font:500 13px var(--f-mono);white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.sla.hot{border-color:var(--cor-bd);background:var(--cor-bg);color:#D9402A}
.reason.muted h4,.reason.muted p{color:var(--muted)}
.scoreband{display:grid;grid-template-columns:1fr 1.05fr;gap:28px;align-items:start}
.matrix{display:grid;grid-template-columns:44px repeat(3,1fr);gap:6px}
.matrix .mh{font:700 12px var(--f-sans);color:var(--ink);text-align:center;padding-bottom:2px;line-height:1.3}
.matrix .rh{font:700 16px var(--f-sans);display:grid;place-items:center;color:var(--ink)}
.cell{font:inherit;text-align:left;border-radius:8px;border:1px solid var(--line-2);background:var(--soft);padding:10px 12px;min-height:66px;display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:pointer;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.cell b{font:500 13px var(--f-mono)}
.cell span{font-size:13px;line-height:1.3;color:var(--text-2)}
.cell.hot{background:var(--cor-bg);border-color:var(--cor-bd)} .cell.hot b{color:#D9402A}
.cell.eval{background:var(--vio-bg);border-color:var(--vio-bd)} .cell.eval b{color:var(--violet)}
.cell.edu{background:var(--blue-bg);border-color:var(--blue-bd)} .cell.edu b{color:var(--blue)}
.cell:hover{border-color:var(--muted)}
.cell[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink);border-color:var(--ink)}
.cell.excl{grid-column:2 / -1;min-height:0;background:var(--bg);border-style:dashed;cursor:default}
.cell-detail{border:1px solid var(--line-2);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;min-height:100%}
.cell-detail .big{font-size:26px;line-height:1.2}
.cell-detail p{font-size:15px;color:var(--text-2)}
.journey{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative;margin-top:8px}
.journey::before{content:"";position:absolute;left:12%;right:12%;top:15px;height:2px;background:var(--grad-soft);opacity:.7}
.jstep{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.jdot{width:32px;height:32px;border-radius:50%;background:var(--bg);border:1.5px solid var(--ink);display:grid;place-items:center;font:500 12px var(--f-mono);position:relative;z-index:1}
.jstep h4{font-size:15px;font-weight:600;line-height:1.3}
.jstep p{font-size:14px;color:var(--text-2);line-height:1.5;max-width:28ch}
.note-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.note{font-size:14px;color:var(--text-2);border:1px solid var(--line-2);border-radius:999px;padding:6px 14px;background:var(--bg)}
.note b{color:var(--ink);font-weight:600}

/* A3 */

.cb-lane > span{font:600 10.5px var(--f-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
.cb-lane > div{display:flex;flex-wrap:wrap;gap:6px}
.cb-wf{font:500 13px var(--f-sans);border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink);display:inline-flex;gap:6px;align-items:center;transition:background .15s,border-color .15s,transform .15s}
.cb-wf i{font:500 11px var(--f-mono);font-style:normal;color:var(--muted)}
.cb-wf:hover{transform:translateY(-1px);border-color:var(--muted)}
.cb-wf[aria-pressed="true"]{background:#FF7A59;border-color:#FF7A59;color:#fff}
.cb-wf[aria-pressed="true"] i{color:rgba(255,255,255,.7)}
.cb-wf.hero{border-color:#FFB49F}
.cb-det{padding:20px 22px;display:flex;flex-direction:column;gap:12px;background:var(--soft)}
.cb-det h4{font-size:20px;font-weight:400}
.cb-det h4 i{font:500 13px var(--f-mono);font-style:normal;color:#E8643E;margin-right:6px}
.cb-det p{font-size:14px;color:var(--text-2)}
.cb-det dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:0;font-size:13.5px}
.cb-det dt{font:600 10.5px var(--f-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.cb-det dd{margin:0;color:var(--ink)}
@media (max-width:860px){.cb-cat{grid-template-columns:1fr}.cb-grid{border-right:0;border-bottom:1px solid var(--line-2)}}
.cb-two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.cb-two .subhead{align-items:flex-start;text-align:left}
@media (max-width:860px){.cb-two{grid-template-columns:1fr}}
.cb-gate{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:g}
.cb-gate li{counter-increment:g;display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;font-size:13.5px;color:var(--text-2);background:#fff;opacity:.35;transform:translateX(-6px);transition:opacity .4s,transform .4s}
.cb-gate.go li{opacity:1;transform:none}
.cb-gate li::before{content:counter(g);flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11.5px var(--f-sans);background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.cb-gate b{color:var(--ink);font-weight:600}
.cb-gate span{margin-left:auto;font:600 11px var(--f-sans);border-radius:999px;padding:2px 9px;white-space:nowrap}
.cb-gate .x{background:var(--cor-bg);color:#D9402A}.cb-gate .w{background:#FFF7E6;color:#B07A00}.cb-gate .ok{background:#F1FAF5;color:#1F8A5B}
.cb-never{font-size:13px;color:var(--text-2);margin-top:12px}
.cb-never b{color:var(--ink)}
.cb-src{display:flex;flex-direction:column;gap:8px}
.cb-tl{position:relative;height:74px;margin:0 6px 6px;border-bottom:3px solid #E3E8EF}
.cb-tl span{white-space:nowrap;position:absolute;bottom:-9px;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:6px;font-size:12px;color:var(--ink);text-align:center;line-height:1.2}
.cb-tl small{color:var(--muted);font-size:11px}
.cb-tl i{width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.cb-tl .t1{background:#1E71ED}.cb-tl .t2{background:#9214C4}.cb-tl .t3{background:#F2583C}.cb-tl .t4{background:#3FAE7A}
.cb-f{display:grid;grid-template-columns:150px auto 1fr;align-items:center;gap:12px;border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;background:#fff;font-size:13px}
.cb-f b{font-weight:600}
.cb-f span{font:600 12px var(--f-sans);border-radius:999px;padding:2px 10px;color:#fff;justify-self:start}
.cb-f:nth-of-type(2) span{background:#1E71ED}.cb-f:nth-of-type(3) span{background:#F2583C}.cb-f:nth-of-type(4) span{background:#3FAE7A}
.cb-f p{color:var(--text-2);font-size:12.5px}
@media (max-width:560px){.cb-f{grid-template-columns:1fr}}
.ex-tag{font:700 15px var(--f-sans);letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(90deg,#F2583C,#9214C4 54%,#1E71ED);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:6px}
.wf{padding:0;overflow:hidden}
.wf-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line-2);background:var(--soft)}
.wf-k{font:600 10.5px var(--f-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
.wf-btns{display:flex;flex-wrap:wrap;gap:6px}
.wf-btns button{font:500 12.5px var(--f-sans);border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink)}
.wf-btns button[aria-pressed="true"]{background:#03A2E1;border-color:#03A2E1;color:#fff}
.wf-wrap{overflow-x:auto;padding:18px 14px 6px}
.wf-svg{display:block;width:100%;min-width:900px;height:auto}
.wf-n rect{fill:#fff;stroke:#D8DFE9;stroke-width:1.4;transition:fill .3s,stroke .3s}
.wf-n .t{font:600 13.5px var(--f-sans);fill:var(--ink)}
.wf-n .s{font:400 11.5px var(--f-sans);fill:var(--text-2)}
.wf-n.trig rect{fill:#FFF4EF;stroke:#FF7A59}
.wf-n.if rect{fill:#F8FAFC;stroke:#C5CEDA;stroke-dasharray:4 3}
.wf-n.set rect{fill:var(--vio-bg);stroke:#DCD3FB}
.wf-n.back rect{fill:var(--blue-bg);stroke:var(--blue-bd)}
.wf-n.dq rect{fill:#F3F4F6;stroke:#D1D5DB}
.wf-n.end rect{fill:#F3F4F6;stroke:#D1D5DB}
.wf-l{fill:none;stroke:#C5CEDA;stroke-width:1.6;transition:stroke .3s,stroke-width .3s}
.wf-b{font:600 11px var(--f-sans);fill:var(--muted)}
.wf-note{font:500 11px var(--f-sans);fill:var(--muted)}
.wf-st rect{fill:#E6F6FC;stroke:#9ED9F0}
.wf-st text{font:600 11px var(--f-sans);fill:#027BAA}
.wf-svg.sel .wf-n:not(.on){opacity:.35}
.wf-svg.sel .wf-st:not(.on){opacity:.35}
.wf-n,.wf-st{transition:opacity .3s}
.wf-svg.sel .wf-l.on{stroke:#9214C4;stroke-width:2.6}
.wf-svg.sel .wf-n.on rect{stroke:#9214C4;stroke-width:2}
.wf-svg.sel .wf-st.on rect{fill:#03A2E1;stroke:#03A2E1}.wf-svg.sel .wf-st.on text{fill:#fff}
.wf-res{margin:4px 18px 16px;padding:12px 16px;border-radius:12px;background:var(--soft);border:1px solid var(--line-2);font-size:14px;color:var(--text-2)}
.wf-res b{color:var(--ink)}
.wf-rules{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.wf-rules div{border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;background:#fff}
.wf-rules b{font-size:14.5px;font-weight:600}
.wf-rules p{font-size:13px;color:var(--text-2);margin-top:4px;line-height:1.45}
@media (max-width:1020px){.wf-rules{grid-template-columns:1fr 1fr}}
.dq-match{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative}
.dq-match > div{border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;background:#fff;display:flex;flex-direction:column;gap:6px;position:relative}
.dq-match > div:not(:last-child)::after{content:"no →";position:absolute;right:-9px;top:50%;transform:translate(50%,-50%);font:600 10.5px var(--f-sans);color:var(--muted);background:var(--bg);padding:2px 0;z-index:1}
.dq-match .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 12.5px var(--f-sans);color:#fff;background:linear-gradient(135deg,#F2583C,#9214C4)}
.dq-match b{font-size:14.5px;font-weight:600}
.dq-match p{font-size:13px;color:var(--text-2)}
@media (max-width:860px){.dq-match{grid-template-columns:1fr}.dq-match > div::after{display:none}}
.dq-pipe{display:grid;grid-template-columns:1fr 1.4fr 1fr 1fr 1.5fr;gap:0;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:#fff}
.dq-pipe > div{padding:14px 16px;position:relative;display:flex;flex-direction:column;gap:4px;opacity:.25;transition:opacity .45s}
.dq-pipe.go > div{opacity:1}
.dq-pipe > div + div{border-left:1px solid var(--line-2)}
.dq-pipe > div:not(.out)::after{content:"";position:absolute;right:-7px;top:50%;width:12px;height:12px;background:#fff;border-top:1px solid var(--line-2);border-right:1px solid var(--line-2);transform:translateY(-50%) rotate(45deg);z-index:1}
.dq-pipe b{font-size:14px;font-weight:600}
.dq-pipe p{font-size:12.5px;color:var(--text-2);line-height:1.45}
.dq-pipe .out{background:#F1FAF5}
.dq-pipe ul{margin:2px 0 0;padding:0 0 0 16px;font-size:12.5px;color:var(--ink);line-height:1.6}
@media (max-width:860px){.dq-pipe{grid-template-columns:1fr}.dq-pipe > div + div{border-left:0;border-top:1px solid var(--line-2)}.dq-pipe > div::after{display:none}}
.dq-own{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dq-own > div{border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:#fff}
.dq-own p{font-size:13px;color:var(--text-2)}
.dq-mon{display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:#fff}
.dq-mon > div{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;font-size:13.5px;color:var(--text-2)}
.dq-mon > div + div{border-top:1px solid var(--line-2)}
.dq-mon b{font:600 12px var(--f-mono);color:#1F8A5B;background:#F1FAF5;border:1px solid #CBE9D9;border-radius:999px;padding:2px 10px}


.dq-wf{display:flex;flex-direction:column;gap:22px;max-width:920px;margin:0 auto}
.dq-r{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;position:relative;opacity:.2;transform:translateY(8px);transition:opacity .5s,transform .5s;transition-delay:calc(var(--i)*.35s)}
.dq-wf.go .dq-r{opacity:1;transform:none}
.dq-wf.nt .dq-r{transition:none}
.dq-r .q{margin-left:calc(var(--i)*36px);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;background:#fff;display:flex;align-items:center;gap:10px;position:relative}
.dq-r .q b{font-size:14.5px;font-weight:600}
.dq-r .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 12.5px var(--f-sans);color:#fff;background:linear-gradient(135deg,#F2583C,#9214C4)}
.dq-r:not(.last) .q::after{content:"No ↓";position:absolute;left:46px;bottom:-21px;font:600 11px var(--f-sans);color:var(--muted)}
.dq-r .y{text-align:center;font:600 12px var(--f-sans);color:#1F8A5B}
.dq-r .o{border:1px solid #CBE9D9;background:#F1FAF5;border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--ink)}
.dq-r .o.new{border-color:var(--blue-bd);background:var(--blue-bg)}
@media (max-width:760px){.dq-r{grid-template-columns:1fr}.dq-r .q{margin-left:0}.dq-r .y{text-align:left;padding:4px 0}.dq-r:not(.last) .q::after{display:none}}

.lg-hs{display:inline-block;width:64px;height:18px;flex:none}
.sy{display:grid;grid-template-columns:1fr 1.05fr 1fr;gap:18px;align-items:stretch}
.sy-col{display:flex;flex-direction:column;gap:8px}
.sy-h{display:flex;align-items:center;gap:8px;font:600 11px var(--f-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.sy-p{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:#fff}
.sy-p b{font-size:14px;font-weight:600}
.sy-p span{font-size:12.5px;color:var(--text-2)}
.sy-p.stay{background:var(--soft)}
.sy-p.go{border-color:#FFB49F;background:#FFF4EF}
.sy-p.no{background:#F3F4F6;opacity:.75}.sy-p.no b{text-decoration:line-through;color:var(--muted)}
.sy-p.lead,.sy-p.con{border-color:#9ED9F0;background:#E6F6FC}
.sy-gate{border:1px dashed #A191FD;border-radius:14px;padding:14px 16px;background:var(--vio-bg);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.sy-gt{display:flex;align-items:center;gap:10px}
.sy-gt span{font:600 14px var(--f-sans);color:var(--violet)}
.sy-gate ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13px;color:var(--ink)}
.sy-gate li::before{content:"✓";color:#1FA971;font-weight:700;margin-right:8px}
.sy-flow{position:relative;height:16px;margin:2px 0}
.sy-flow::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:linear-gradient(90deg,#FF7A59,#03A2E1);opacity:.4}
.sy-flow i{position:absolute;top:3px;width:10px;height:10px;border-radius:50%;background:#9214C4;animation:syMove 2.4s linear infinite}
.sy-flow i:nth-child(2){animation-delay:.8s}.sy-flow i:nth-child(3){animation-delay:1.6s}
@keyframes syMove{from{left:0;background:#FF7A59}to{left:calc(100% - 10px);background:#03A2E1}}
@media (prefers-reduced-motion:reduce){.sy-flow i{animation:none}}
.sy-when{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid #DCD3FB;padding-top:8px}
.sy-when b{font-size:14px}.sy-when span{font-size:12.5px;color:var(--text-2)}
@media (max-width:860px){.sy{grid-template-columns:1fr}}
.fw{padding:0;overflow:hidden}
.fw-hd,.fw-r{display:grid;grid-template-columns:230px 200px 1fr;gap:16px;align-items:center;padding:10px 20px}
.fw-hd{font:600 10.5px var(--f-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--soft);border-bottom:1px solid var(--line-2)}
.fw-hd .c{text-align:center}
.fw-r + .fw-r{border-top:1px solid var(--line-2)}
.fw-r b{font-size:14.5px;font-weight:600}
.fw-r p{font-size:13.5px;color:var(--text-2)}
.fw-mid{display:flex;align-items:center;justify-content:center;gap:8px}
.fw-a{position:relative;width:60px;height:14px;flex:none}
.fw-a i{position:absolute;top:6px;left:0;right:0;height:2px;background:#C5CEDA}
.fw-a.l i{background:linear-gradient(270deg,#03A2E1,rgba(3,162,225,.15))}

<script>
(function(){
/* ---------- hero wave ---------- */
  var cv=document.getElementById('wave'),ctx=cv.getContext('2d'),W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2),t0=performance.now();
  var still=matchMedia('(prefers-reduced-motion: reduce)').matches,visible=true;
  function size(){var r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  function lerp(a,b,t){return a+(b-a)*t}
  function mix(c1,c2,t){return 'rgb('+Math.round(lerp(c1[0],c2[0],t))+','+Math.round(lerp(c1[1],c2[1],t))+','+Math.round(lerp(c1[2],c2[2],t))+')'}
  var C=[[30,113,237],[146,20,196],[242,88,60],[255,196,150]];
  function col(t){t=Math.max(0,Math.min(1,t));var s=t*3,i=Math.min(2,Math.floor(s));return mix(C[i],C[i+1],s-i)}
  function draw(now){
    var t=(now-t0)/1000*2.6;
    var g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0B1A44');g.addColorStop(.45,'#1A2B7A');g.addColorStop(.75,'#5B1E8C');g.addColorStop(1,'#C2465A');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    var glow=ctx.createRadialGradient(W*.78,H*.25,0,W*.78,H*.25,W*.55);glow.addColorStop(0,'rgba(255,170,120,.55)');glow.addColorStop(1,'rgba(255,170,120,0)');
    ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
    var N=46;ctx.lineWidth=1.1;
    for(var i=0;i<N;i++){
      var p=i/(N-1);ctx.beginPath();
      for(var x=-10;x<=W+10;x+=8){
        var u=x/W;
        var crest=Math.exp(-Math.pow((u-0.62)/0.22,2));
        var y=H*(0.92-p*0.62)
          -crest*H*0.28*(1-p*0.5)
          +Math.sin(u*6.2+t*0.6+p*3.1)*10*(0.5+p)
          +Math.sin(u*13+t*1.1-p*5)*4;
        if(x<=-10)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.strokeStyle=col(p);ctx.globalAlpha=0.18+0.5*Math.pow(1-Math.abs(p-0.55)*1.6,2);ctx.stroke();
    }
    ctx.globalAlpha=1;
    if(!still&&visible)requestAnimationFrame(draw);
  }
  size();draw(t0);
  window.addEventListener('resize',function(){size();if(still||!visible)draw(performance.now())});
  if('IntersectionObserver' in window){new IntersectionObserver(function(es){var v=es[0].isIntersecting;if(v&&!visible&&!still){visible=true;requestAnimationFrame(draw)}visible=v}).observe(cv)}

})();
</script>
<script>
(function(){
  var S=window.crypto&&crypto.subtle,F=document.getElementById('gate'),I=document.getElementById('pw'),B=document.getElementById('gbtn'),M=document.getElementById('gmsg'),D=document.getElementById('sealed');
  var LS='upwind-gtm-access';
  function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
  function b64(a){var s='';for(var i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)}
  function get(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}}
  function put(v){try{localStorage.setItem(LS,JSON.stringify(v))}catch(e){}}
  function forget(){try{localStorage.removeItem(LS)}catch(e){}}
  var K=null;
  function keyJson(){if(K)return Promise.resolve(K);return fetch('key.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('key');return r.json()}).then(function(j){K=j;return j})}
  function unwrap(pw,k){return S.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){
      return S.deriveKey({name:'PBKDF2',salt:u8(k.salt),iterations:k.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])})
    .then(function(pk){return S.decrypt({name:'AES-GCM',iv:u8(k.iv)},pk,u8(k.wrapped))}).then(function(raw){return new Uint8Array(raw)})}
  function open(raw,v){return S.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(ck){
      return S.decrypt({name:'AES-GCM',iv:u8(D.getAttribute('data-iv'))},ck,u8(D.textContent.trim()))})
    .then(function(buf){var html=new TextDecoder().decode(buf);put({v:v,k:b64(raw)});var h=location.hash;
      document.open();document.write(html);document.close();
      if(h){setTimeout(function(){var t=document.getElementById(h.slice(1));if(t)t.scrollIntoView()},300)}})}
  function msg(t,bad){M.textContent=t;F.classList.toggle('bad',!!bad);if(bad)setTimeout(function(){F.classList.remove('bad')},400)}
  if(!S){msg('This browser can’t open the page. Try a recent Chrome, Safari, Edge or Firefox.',true);B.disabled=true;return}
  keyJson().then(function(k){var r=get();if(r&&r.v===k.v&&r.k){document.body.classList.add('unlocking');return open(u8(r.k),k.v).catch(function(){forget();document.body.classList.remove('unlocking')})}if(r)forget()}).catch(function(){});
  setTimeout(function(){if(!document.body.classList.contains('unlocking'))I.focus()},50);
  F.addEventListener('submit',function(e){e.preventDefault();var pw=I.value;if(!pw){msg('Enter the password to continue.',true);return}
    B.disabled=true;msg('Opening…');document.body.classList.add('unlocking');
    keyJson().then(function(k){return unwrap(pw,k).then(function(raw){return open(raw,k.v)})})
      .catch(function(){B.disabled=false;document.body.classList.remove('unlocking');msg('That password didn’t work. Try again.',true);I.select()})});
})();
</script>
