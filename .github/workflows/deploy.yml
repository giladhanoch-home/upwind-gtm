name: Deploy site

# Publishes the site to GitHub Pages (Settings → Pages → Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the public files
        run: mkdir _site && cp index.html brain.html key.json _site/ && touch _site/.nojekyll
      - name: Clear any stuck previous deployment
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          for sha in $(gh api "repos/$R/deployments?environment=github-pages&per_page=5" -q '.[].sha' | sort -u); do
            st=$(gh api "repos/$R/pages/deployments/$sha" -q .status 2>/dev/null || true)
            echo "$sha $st"
            case "$st" in deployment_in_progress|syncing_files|updating_pages|deployment_queued|"")
              [ -n "$st" ] && gh api -X POST "repos/$R/pages/deployments/$sha/cancel" >/dev/null && echo "cancelled $sha" || true;;
            esac
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
