name: Deploy site

# Publishes the site to GitHub Pages (Settings → Pages → Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the public files
        run: mkdir _site && cp index.html brain.html key.json _site/ && touch _site/.nojekyll
      - name: Clear any stuck previous deployment
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          for sha in $(gh api "repos/$R/deployments?environment=github-pages&per_page=3" -q '.[].sha' | sort -u); do
            [ "$sha" = "$GITHUB_SHA" ] && continue
            echo "$sha: $(gh api "repos/$R/pages/deployments/$sha" -q .status 2>/dev/null)"
            gh api -X POST "repos/$R/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "  cancel ok" || echo "  cancel n/a"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
