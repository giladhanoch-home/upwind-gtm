name: Check live site
on:
  push:
    paths: ['.github/workflows/check-live.yml']
permissions:
  contents: read
  pages: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B=https://giladhanoch-home.github.io/upwind-gtm
          for f in "" index.html brain.html key.json "brain.html?v=9"; do echo "$(curl -s -o /dev/null -w '%{http_code} %{size_download}' "$B/$f") $f"; done
          gh api repos/${{ github.repository }}/pages -q '{status,build_type,html_url}' || true
